app-id: io.github.mmclinton.Spectral
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # pipewire-sys generates its bindings with bindgen, which needs libclang.
  - org.freedesktop.Sdk.Extension.llvm22
command: spectral

# Spectral talks to PipeWire directly and renders through Slint's software
# renderer, so it needs neither the PulseAudio compatibility socket nor a GPU.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-run/pipewire-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib

modules:
  - name: spectral
    buildsystem: simple
    build-options:
      env:
        # Where cargo-sources.json unpacks the vendored registry, so
        # --offline resolves. Must match this module's build directory.
        CARGO_HOME: /run/build/spectral/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 -t /app/bin target/release/spectral target/release/spectral-daemon
      - install -Dm644 assets/io.github.mmclinton.Spectral.desktop
        /app/share/applications/io.github.mmclinton.Spectral.desktop
      - install -Dm644 assets/io.github.mmclinton.Spectral.metainfo.xml
        /app/share/metainfo/io.github.mmclinton.Spectral.metainfo.xml
      - install -Dm644 assets/spectral.png
        /app/share/icons/hicolor/512x512/apps/io.github.mmclinton.Spectral.png
      - install -Dm644 -t /app/share/licenses/io.github.mmclinton.Spectral
        LICENSE THIRD-PARTY.md
      # The man page and the completions are deliberately not installed.
      # Flatpak exports only applications, icons, metainfo, MIME and D-Bus
      # services from /app/share, so none of them would reach the host's
      # manpath or a shell's completion path; and the completions are written
      # for a command named `spectral`, which a Flatpak install does not
      # provide — its export is io.github.mmclinton.Spectral.
    sources:
      # Development manifest: builds the checked-out repository. The Flathub
      # submission replaces this entry with the public release; see README.md.
      - type: git
        path: ../..
        branch: main
      - cargo-sources.json
