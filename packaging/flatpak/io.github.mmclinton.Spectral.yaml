app-id: io.github.mmclinton.Spectral
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # pipewire-sys generates its bindings with bindgen, which needs libclang.
  - org.freedesktop.Sdk.Extension.llvm22
command: spectral

# Spectral talks to PipeWire directly and renders through Slint's software
# renderer, so it needs neither the PulseAudio compatibility socket nor a GPU.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-run/pipewire-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib

modules:
  - name: spectral
    buildsystem: simple
    build-options:
      env:
        # Where cargo-sources.json unpacks the vendored registry, so
        # --offline resolves. Must match this module's build directory.
        CARGO_HOME: /run/build/spectral/cargo
    build-commands:
      - cargo --offline build --release --locked
      # --app-only: Flatpak exports only applications, icons, metainfo, MIME
      # and D-Bus services from /app/share, so the man page and completions
      # would never reach the host's manpath or a shell's completion path;
      # and the completions are written for a command named `spectral`,
      # which a Flatpak install does not provide: its export is the app ID.
      - cargo --offline xtask install --prefix /app
        --licensedir /app/share/licenses/io.github.mmclinton.Spectral --app-only
    sources:
      # The tree this manifest sits in: a `git archive` export when built by
      # `cargo xtask package flatpak`, otherwise a working copy, whose build
      # leftovers are skipped.
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - builddir
          - repo
          - result
          - target
      - cargo-sources.json
