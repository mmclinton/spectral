name: ci
on:
  push:
    branches: ['**']

jobs:
  check:
    # Self-hosted host-mode runner with Nix on PATH; Codeberg's
    # hosted runners may not fit this build inside their 10-minute cap.
    runs-on: self-hosted
    steps:
      - uses: https://github.com/actions/checkout@v4
      - run: nix flake check --print-build-logs
