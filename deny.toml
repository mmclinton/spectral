# Supply-chain policy for `cargo deny check`.
# Advisories fetch the RustSec DB over the network, which is why this runs
# in its own workflow (.forgejo/workflows/deny.yml: weekly, and on any change
# to the manifest, the lockfile or this file) and by hand at step 4 of
# docs/RELEASING.md, not inside nix flake check.

[graph]
# Only what we ship; drops windows/macos/android arms of slint's dep tree.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
# Unmaintained-crate advisories only fail for direct dependencies — those we
# can act on. Vulnerabilities still deny everywhere in the tree.
#
# What this actually suppresses, re-derived 2026-10-22 by running with
# unmaintained = "all": four crates. The first is a final upstream release
# with no upgrade to move to, ever.
#
#   ttf-parser 0.25.1 RUSTSEC-2026-0192  via ab_glyph -> sctk-adwaita -> winit
#
# The other three were folded into zbus 6 rather than abandoned, and arrive
# through slint's accessibility stack (accesskit_unix -> atspi, zbus 5). They
# clear when accesskit moves to zbus 6; nothing on our side can move them.
#
#   zbus_names 4.3.4       RUSTSEC-2026-0371
#   zvariant 5.15.0        RUSTSEC-2026-0370
#   zvariant_derive 5.15.0 RUSTSEC-2026-0372  proc-macro
#
# The load-bearing argument is reachability, not upgrade cost. ttf-parser is
# live only through winit's Wayland client-side title bar, which reads system
# fonts from directories no other local user can write, and it is
# #![forbid(unsafe_code)]. Slint's own text and SVG paths do not use it, so
# neither an image asset nor a user-chosen font reaches it; only a change
# that hands the title bar a font from somewhere less trusted would put an
# unmaintained parser on an untrusted-input path.
unmaintained = "workspace"

# Unsound advisories fail anywhere in the tree. cargo-deny's default reports
# them only for direct dependencies, which left memmap2 0.9.10
# (RUSTSEC-2026-0186) in the tree unreported until a manual sweep found it.
# Notice advisories always fail; cargo-deny has no setting for them.
unsound = "all"

[licenses]
# The binary is GPL-3.0-only, so any GPL-3.0-compatible license is
# acceptable. This list tracks the atoms present in Cargo.lock, with some
# slack: cargo deny warns `license-not-encountered` for allowances no locked
# crate currently uses (BSL-1.0 and NCSA today), which is informational, not
# a policy error. BSD-2-Clause and BSD-3-Clause additionally require notices
# in THIRD-PARTY.md — see the recipe at the foot of that file for which
# crates actually incur the duty.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-only", # spectral itself + the GPL arm of slint's tri-license
  "ISC",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
# slint's tree ships known duplicates (smol_str 0.2 + 0.3); deny would be
# unactionable, so surface without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
