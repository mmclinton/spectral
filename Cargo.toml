[package]
name = "spectral"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["mmc <codeberg.wilder850@simplelogin.com>"]
repository = "https://codeberg.org/mmc/spectral"
description = "Real-time audio noise suppression application"

[lib]
name = "spectral_lib"
path = "src/lib.rs"

[[bin]]
name = "spectral"
path = "src/main.rs"

[[bin]]
name = "spectral-daemon"
path = "src/bin/spectral-daemon.rs"

[dependencies]
slint = "1.14.1"
pipewire = { version = "0.9", features = ["v0_3_77"] }
nnnoiseless = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libpulse-binding = "2.30"
signal-hook = "0.3"
hound = "3.5"

[build-dependencies]
slint-build = "1.14.1"
