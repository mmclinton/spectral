[package]
name = "spectral"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.12.1"
pipewire = { version = "0.9", optional = true, features = ["v0_3_77"] }
nnnoiseless = { version = "0.5", optional = true }

[features]
default = ["linux"]
linux = ["pipewire", "nnnoiseless"]
macos = []
windows = []

[build-dependencies]
slint-build = "1.12.1"
