[package]
name = "spectral"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
authors = ["mmc <codeberg.wilder850@simplelogin.com>"]
repository = "https://codeberg.org/mmc/spectral"
homepage = "https://codeberg.org/mmc/spectral"
description = "Real-time audio noise suppression application"
readme = "README.md"
keywords = ["noise-suppression", "pipewire", "rnnoise", "audio", "microphone"]
categories = ["multimedia::audio"]

[lib]
name = "spectral_lib"
path = "src/lib.rs"

[[bin]]
name = "spectral"
path = "src/main.rs"

[[bin]]
name = "spectral-daemon"
path = "src/bin/spectral-daemon.rs"

[lints.rust]
# Matches the flake's clippy gate (--deny warnings): bare cargo build/clippy
# hits the same wall as nix flake check.
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
    "compat-1-2",
    "std",
    "accessibility",
    "backend-winit",
    "renderer-software",
] }
pipewire = { version = "0.9", features = ["v0_3_77"] }
# Slint's own font database, so a family name resolved here is one Slint can
# look up. Kept in step with slint rather than upgraded independently.
fontique = "0.10"
# Pinned to 0.5.1: 0.5.2 deletes the crate's own FFT and swaps rustfft for
# easyfft, which adds a thread-local HashMap lookup and an extra copy per
# transform on the audio path, and renormalizes the output — no functional
# gain for us. Revisit only with listening validation.
# Default features exist solely to build nnnoiseless's CLI binary (clap,
# dasp); the library needs only once_cell and rustfft.
nnnoiseless = { version = "=0.5.1", default-features = false }
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
signal-hook = "0.3"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
# panic stays "unwind": lock_or_recover's poisoning recovery and the PipeWire
# FFI boundary depend on unwinding, never aborting.
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
