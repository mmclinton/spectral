[package]
name = "spectral"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["mmc <codeberg.wilder850@simplelogin.com>"]
repository = "https://codeberg.org/mmc/spectral"
homepage = "https://codeberg.org/mmc/spectral"
description = "Real-time audio noise suppression application"
readme = "README.md"
keywords = ["noise-suppression", "pipewire", "rnnoise", "audio", "microphone"]
categories = ["multimedia::audio"]

[lib]
name = "spectral_lib"
path = "src/lib.rs"

[[bin]]
name = "spectral"
path = "src/main.rs"

[[bin]]
name = "spectral-daemon"
path = "src/bin/spectral-daemon.rs"

[dependencies]
slint = { version = "=1.15.0", default-features = false, features = [
    "compat-1-2",
    "std",
    "accessibility",
    "backend-winit",
    "renderer-software",
] }
pipewire = { version = "0.9", features = ["v0_3_77"] }
nnnoiseless = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
signal-hook = "0.3"

[build-dependencies]
slint-build = "=1.15.0"

[profile.release]
# panic stays "unwind": lock_or_recover's poisoning recovery and the PipeWire
# FFI boundary depend on unwinding, never aborting.
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
